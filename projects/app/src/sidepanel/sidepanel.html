<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>DeskDeck-Solo Side Panel</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div id="deckApp" class="deck-app">
      <!-- Header Controls -->
      <header class="deck-header">
        <div class="deck-header-row">
          <label for="deckSelect" class="sr-only" data-i18n="deckSelectLabel">Select Deck</label>
          <select id="deckSelect" class="deck-select">
            <!-- Populated dynamically -->
          </select>
          <button id="optionsBtn" class="icon-btn" aria-label="Settings" title="Settings">
            <span class="material-symbols-outlined">settings</span>
          </button>
        </div>
      </header>

      <!-- Main Active Deck Hardware Area -->
      <main id="deckWorkspace" class="deck-workspace">
        <div id="slotsContainer" class="slots-grid">
          <!-- Hardware slots dynamically populated here -->
        </div>
      </main>

      <!-- In-panel settings. The options page opens in a browser tab,
           out of the right thumb's reach in tablet mode, so the same
           settings also live inside the panel (real-device feedback,
           2026-11-22). Toggles apply immediately. -->
      <section id="settingsView" class="settings-view" hidden>
        <div class="settings-head">
          <button id="settingsBackBtn" class="icon-btn" aria-label="Back" title="Back">
            <span class="material-symbols-outlined">arrow_back</span>
          </button>
          <h2 class="settings-title" data-i18n="optionsTitle">DeskDeck-Solo Settings</h2>
        </div>
        <div class="setting-item">
          <label for="settingsSound" data-i18n="soundEffects">Sound Feedback</label>
          <input type="checkbox" id="settingsSound" class="toggle-checkbox" />
        </div>
        <div class="setting-item">
          <label for="settingsHaptic" data-i18n="hapticFeedback">Haptic Feedback</label>
          <input type="checkbox" id="settingsHaptic" class="toggle-checkbox" />
        </div>
      </section>

      <!-- Deck Footer Status -->
      <footer class="deck-footer">
        <div class="footer-info"></div>
      </footer>
    </div>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
