<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>DeskDeck-Solo Side Panel</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div id="deckApp" class="deck-app">
      <!-- Header Controls -->
      <header class="deck-header">
        <div class="deck-header-row">
          <label for="deckSelect" class="sr-only" data-i18n="deckSelectLabel">Select Deck</label>
          <select id="deckSelect" class="deck-select">
            <!-- Populated dynamically -->
          </select>
          <button id="optionsBtn" class="icon-btn" aria-label="Settings" title="Settings">
            <span class="material-symbols-outlined">settings</span>
          </button>
        </div>
      </header>

      <!-- Main Active Deck Hardware Area -->
      <main class="deck-workspace">
        <div id="slotsContainer" class="slots-grid">
          <!-- Hardware slots dynamically populated here -->
        </div>
      </main>

      <!-- Deck Footer Status -->
      <footer class="deck-footer">
        <div class="footer-info"></div>
      </footer>
    </div>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
