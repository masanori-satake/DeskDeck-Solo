<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Watch fixture</title>
    <style>
      body {
        margin: 0;
      }
      #spacer {
        height: 3000px;
      }
    </style>
  </head>
  <body>
    <div id="movie_player" class="html5-video-player">
      <div class="html5-video-container">
        <video class="html5-main-video" muted playsinline></video>
      </div>
    </div>
    <div id="spacer"></div>
    <script>
      // Give the video a real, playable stream (canvas capture) so that
      // play()/pause() and the paused flag behave like a real YouTube video.
      const canvas = document.createElement('canvas');
      canvas.width = 320;
      canvas.height = 180;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#333';
      ctx.fillRect(0, 0, 320, 180);
      const video = document.querySelector('video.html5-main-video');
      video.srcObject = canvas.captureStream(5);
    </script>
  </body>
</html>
