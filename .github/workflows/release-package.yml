name: 'リリースパッケージ公開 (Release Package)'

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: '共通リリース処理実行 (Execute Base Release)'
    uses: masanori-satake/common-workflows/.github/workflows/base-release.yml@v1
    permissions:
      contents: write
    with:
      # リリース ZIP は base-release 側で {リポジトリ名}-v{version}.zip に統一生成する（方式A）。
      package_source_dir: 'projects/app'
    # アイコン(PNG)は projects/app/icons に事前コミット済みのため generate_icons は使わない（SVG/生成なし）。
    # マニフェストは projects/app/manifest.json のためリネーム不要。
    # 旧 push:main トリガーの自動リリースは廃止し、タグ(v*.*.*) push トリガーに統一した。
