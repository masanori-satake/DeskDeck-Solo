name: Automated Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract Version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Extracted version: $VERSION"

      - name: Check if Git Tag Exists
        id: check_tag
        run: |
          TAG_NAME="v${VERSION}"
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1 || git ls-remote --tags origin "$TAG_NAME" | grep -q "$TAG_NAME"; then
            echo "Tag $TAG_NAME already exists. Skipping release."
            echo "exists=true" >> $GITHUB_ENV
          else
            echo "Tag $TAG_NAME does not exist. Proceeding with release creation."
            echo "exists=false" >> $GITHUB_ENV
          fi

      - name: Package Release ZIP Archive
        if: env.exists == 'false'
        run: |
          ZIP_NAME="DeskDeck-Solo-v${VERSION}.zip"
          cd projects/app
          zip -r "../../${ZIP_NAME}" .
          cd ../..
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Create GitHub Release with Exponential Backoff Retry
        if: env.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${VERSION}"
          MAX_RETRIES=5
          RETRY_COUNT=0
          DELAY=5

          echo "Creating GitHub release for tag ${TAG_NAME}..."

          until gh release create "${TAG_NAME}" "${ZIP_NAME}" \
            --title "DeskDeck-Solo ${TAG_NAME}" \
            --notes "Automated release ${TAG_NAME} for DeskDeck-Solo." \
            --target "${GITHUB_SHA}"; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
              echo "Failed to create GitHub release after $MAX_RETRIES attempts."
              exit 1
            fi
            echo "Release upload failed. Retrying in ${DELAY} seconds... (Attempt $RETRY_COUNT / $MAX_RETRIES)"
            sleep $DELAY
            DELAY=$((DELAY * 2))
          done

          echo "GitHub Release ${TAG_NAME} created successfully!"
