name: 'コード品質検証 (Code Quality)'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: '共通品質チェック実行 (Execute Base CI)'
    uses: masanori-satake/common-workflows/.github/workflows/base-ci.yml@v1
    with:
      # Vanilla JS プロジェクトのため型チェックは不要
      run_typecheck: false
    # lint (npm run lint = eslint + prettier --check) と test (node --test) は
    # base CI の `npm run lint/test --if-present` で実行される。
    # マニフェスト・多言語構成検証は scripts/ci_checks.py 経由で
    # node scripts/validate-manifest-locales.js を実行する。
    # 統一パラメータ（Node=lts/*, Python=3.12, npm ci）は base 側デフォルトに閉じ込め済み。
