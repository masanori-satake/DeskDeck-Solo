name: 'ランディングページデプロイ (Deploy Landing Page)'

on:
  push:
    branches: [main]
    paths:
      - 'projects/web/**'
      - 'docs/**'
      - '.github/workflows/deploy-landing-page.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    name: 'GitHub Pages デプロイ (Deploy to GitHub Pages)'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 'リポジトリのチェックアウト (Checkout Repository)'
        uses: actions/checkout@v4

      - name: 'GitHub Pages 設定 (Setup Pages)'
        uses: actions/configure-pages@v4

      - name: '成果物のアップロード (Upload Pages Artifact)'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'projects/web'

      - name: 'GitHub Pages へのデプロイ (Deploy to GitHub Pages)'
        id: deployment
        uses: actions/deploy-pages@v4
