name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run ESLint
        run: npx eslint .

      - name: Run Prettier check
        run: npx prettier --check .

      - name: Check Version Bump
        run: npm run check-version-bump

      - name: Run Unit Tests
        run: npm test

      - name: Validate Extension Manifest, Locales and Version Consistency
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const manifest = JSON.parse(fs.readFileSync("projects/app/manifest.json", "utf8"));
            if (pkg.version !== manifest.version) {
              console.error(`Version mismatch! package.json: ${pkg.version}, manifest.json: ${manifest.version}`);
              process.exit(1);
            }
            if (!/^\d+\.\d+\.\d+$/.test(pkg.version)) {
              console.error(`Invalid version format! package.json: ${pkg.version}`);
              process.exit(1);
            }
            const localeFiles = [
              "projects/app/_locales/ja/messages.json",
              "projects/app/_locales/en/messages.json",
              "projects/web/locales/ja.json",
              "projects/web/locales/en.json"
            ];
            localeFiles.forEach(f => JSON.parse(fs.readFileSync(f, "utf8")));
            console.log(`All JSON files are valid and version is unified at ${pkg.version}!`);
          '
