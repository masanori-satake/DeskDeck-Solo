name: 'Node.js環境セットアップ (Setup Node.js & Dependencies)'
description: 'Node.jsの環境構築および依存関係の高速インストール (Set up Node.js and install npm dependencies with caching)'

inputs:
  node-version:
    description: '使用するNode.jsのバージョン (Node.js version to use)'
    required: false
    default: '24'

runs:
  using: 'composite'
  steps:
    - name: 'Node.js のセットアップ (Setup Node.js environment)'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

    - name: '依存関係のインストール (Install npm dependencies)'
      shell: bash
      run: |
        if [ -f package-lock.json ]; then
          npm ci
        else
          npm install
        fi
